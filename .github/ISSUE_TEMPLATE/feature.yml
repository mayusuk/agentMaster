name: Feature
description: New capability. A maintainer adds status:ready when it can be picked up.
labels: [feature]
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change wanted, and why.
    validations:
      required: true
  - type: textarea
    id: acs
    attributes:
      label: Acceptance criteria
      description: One checkable statement per line.
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      description: One "Blocked by #n" line per issue that must close first.
