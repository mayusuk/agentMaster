name: Issue status

# gh-wf: when a pull request merges into main, close the issues it resolves and
# label them done. pull_request_target lets the token edit issues for PRs from forks.
# It never checks out or runs PR code; PR text reaches the shell only via env vars.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Mark linked issues done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          numbers=$(
            {
              printf '%s\n' "$PR_BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' || true
              printf '%s\n' "$HEAD_REF" | sed -nE 's#^issue/([0-9]+)-.*#\1#p'
            } | sort -un
          )
          for n in $numbers; do
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo MISSING)
            [ "$state" = MISSING ] && { echo "#$n not found"; continue; }
            gh issue edit "$n" --add-label status:done --remove-label status:ready,status:in-progress,status:in-review,status:blocked || true
            if [ "$state" = OPEN ]; then
              gh issue close "$n" --comment "Merged in $PR_URL."
            fi
            echo "#$n done"
          done
