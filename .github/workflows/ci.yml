name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest

  corpus:
    name: Corpus tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --locked
      # Downloads happen here, before tests start; tests themselves cannot open sockets.
      - name: Restore corpora
        uses: actions/cache@v4
        with:
          path: .corpora
          key: corpora-${{ hashFiles('tests/corpora/registry.toml') }}
          restore-keys: corpora-
      - name: Download and verify corpora
        run: uv run python tests/corpora/corpus_fetch.py fetch
      - name: Corpus tests
        env:
          EAGAIN_REQUIRE_CORPORA: "1"
        run: uv run pytest -m corpus
